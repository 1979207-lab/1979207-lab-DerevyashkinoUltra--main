name: Derevyashkino ULTRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Derevyashkino-ULTRA-ready(2).zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f 'Derevyashkino-ULTRA-ready(2).zip'
          unzip -t 'Derevyashkino-ULTRA-ready(2).zip'

      - name: Extract Android project
        run: |
          mkdir -p build-src
          unzip -q 'Derevyashkino-ULTRA-ready(2).zip' -d build-src
          test -f build-src/derevyashkino-ultra/settings.gradle

      - name: Patch Kotlin compilation errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-src/derevyashkino-ultra/app/src/main/java/com/derevyashkino/app")
          nl = chr(10)
          p = root / "MainMenu.kt"
          s = p.read_text()
          s = s.replace("    })" + nl + "}", "    }" + nl + "}")
          assert s != p.read_text(), "MainMenu.kt syntax patch did not match"
          p.write_text(s)
          p = root / "FinanceScreen.kt"
          s = p.read_text()
          old = "@Composable" + nl + "fun FinanceScreen()"
          new = "@OptIn(ExperimentalMaterial3Api::class)" + nl + old
          if old in s:
              s = s.replace(old, new, 1)
          assert "@OptIn(ExperimentalMaterial3Api::class)" in s, "FinanceScreen opt-in patch failed"
          p.write_text(s)
          p = root / "OrdersScreen.kt"
          s = p.read_text()
          old = "@Composable" + nl + "fun OrdersScreen(canEdit: Boolean)"
          new = "@OptIn(ExperimentalMaterial3Api::class)" + nl + old
          if old in s:
              s = s.replace(old, new, 1)
          assert "@OptIn(ExperimentalMaterial3Api::class)" in s, "OrdersScreen opt-in patch failed"
          p.write_text(s)
          PY
          tail -n 4 build-src/derevyashkino-ultra/app/src/main/java/com/derevyashkino/app/MainMenu.kt
          grep -n 'OptIn' build-src/derevyashkino-ultra/app/src/main/java/com/derevyashkino/app/FinanceScreen.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: build-src/derevyashkino-ultra
        run: |
          gradle --no-daemon wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Derevyashkino-ULTRA-debug
          path: build-src/derevyashkino-ultra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
