name: Derevyashkino 22 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f 'Derevyashkino-ULTRA-ready(2).zip'
          unzip -t 'Derevyashkino-ULTRA-ready(2).zip'

      - name: Extract Android project and apply UI update
        run: |
          mkdir -p build-src
          unzip -q 'Derevyashkino-ULTRA-ready(2).zip' -d build-src
          PROJECT=build-src/derevyashkino-ultra
          # Prefer a Maven Central mirror to avoid transient HTTP 429 responses.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-src/derevyashkino-ultra")
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix not in {".gradle", ".kts"}:
                  continue
              try:
                  source = p.read_text()
              except UnicodeDecodeError:
                  continue
              if "mavenCentral()" not in source:
                  continue
              if p.name.endswith(".gradle.kts"):
                  mirror = 'maven { url = uri("https://maven.aliyun.com/repository/central") }; mavenCentral()'
              else:
                  mirror = "maven { url 'https://maven.aliyun.com/repository/central' }; mavenCentral()"
              p.write_text(source.replace("mavenCentral()", mirror))
          PY
          test -f "$PROJECT/settings.gradle"
          APP="$PROJECT/app/src/main"
          JAVA="$APP/java/com/derevyashkino/app"
          echo "=== SOURCE SCREENS FOR PAYMENT AND WEB PARITY ==="
          for name in OrdersScreen.kt FinanceScreen.kt ClientsScreen.kt ChatScreen.kt Models.kt; do
            echo "===== $name ====="
            cat "$JAVA/$name"
          done
          echo "=== ORIGINAL MAIN MENU FROM ZIP ==="
          find "$PROJECT" -name "MainMenu.kt" -print -exec cat {} +
          find "$PROJECT" -name 'MainMenu.kt' -print -exec cat {} +
          cp app-overrides/MainMenu.kt "$JAVA/MainMenu.kt"
          cp app-overrides/LoginScreen.kt "$JAVA/LoginScreen.kt"
          cp app-overrides/ArchiveScreen.kt "$JAVA/ArchiveScreen.kt"
          cp app-overrides/OrdersScreen.kt "$JAVA/OrdersScreen.kt"
          cp app-overrides/FinanceScreen.kt "$JAVA/FinanceScreen.kt"
          cat > "$APP/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.derevyashkino.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Деревяшкино 22"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".AppFirebaseMessagingService" android:exported="false">
                      <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p "$APP/res/mipmap-xxxhdpi"
          base64 -d app-overrides/ic_launcher.png.b64 > "$APP/res/mipmap-xxxhdpi/ic_launcher.png"
          cp "$APP/res/mipmap-xxxhdpi/ic_launcher.png" "$APP/res/mipmap-xxxhdpi/ic_launcher_round.png"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-src/derevyashkino-ultra/app/src/main/java/com/derevyashkino/app")
          for name, signature in [
              ("OrdersScreen.kt", "fun OrdersScreen(canEdit: Boolean)"),
              ("FinanceScreen.kt", "fun FinanceScreen()"),
          ]:
              p = root / name
              s = p.read_text()
              if "@OptIn(ExperimentalMaterial3Api::class)" not in s:
                  s = s.replace("@Composable\n" + signature,
                                "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\n" + signature, 1)
              p.write_text(s)
          PY
          grep -q 'Деревяшкино 22' "$APP/AndroidManifest.xml"
          test -s "$APP/res/mipmap-xxxhdpi/ic_launcher.png"
          echo "=== MAIN ACTIVITY ==="
          sed -n '1,240p' "$JAVA/MainActivity.kt"
          echo "=== USER MODEL DEFINITIONS ==="
          grep -R -n -B 4 -A 18 -E 'data class AppUser|class AppUser|fun AppRoot|fun OrdersScreen|fun ClientsScreen|fun ChatScreen' "$JAVA" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: build-src/derevyashkino-ultra
        run: |
          gradle --no-daemon wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Derevyashkino-22-debug
          path: build-src/derevyashkino-ultra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
