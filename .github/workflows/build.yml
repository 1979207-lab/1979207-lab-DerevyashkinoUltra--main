name: Build Derevyashkino ULTRA APK # phase3 archive upload

on:
  workflow_dispatch:
  push:
    branches:
      - ultra-ready-import
    paths:
      - 'Derevyashkino-ULTRA-phase3-source.zip'
      - 'Derevyashkino-ULTRA-phase3-source (1).zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project archive
        run: |
          ARCHIVE='Derevyashkino-ULTRA-phase3-source.zip'
          if [ ! -f "$ARCHIVE" ]; then ARCHIVE='Derevyashkino-ULTRA-phase3-source (1).zip'; fi
          test -f "$ARCHIVE"
          mkdir project
          unzip -q "$ARCHIVE" -d project
          test -f project/derevyashkino-ultra/app/build.gradle
          test -f project/derevyashkino-ultra/app/google-services.json

      - name: Fix MainMenu.kt syntax
        working-directory: project/derevyashkino-ultra
        run: |
          cat > app/src/main/java/com/derevyashkino/app/MainMenu.kt <<'EOF'
          package com.derevyashkino.app

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainMenu(user: AppUser, onSignOut: () -> Unit) {
              var selected by remember { mutableStateOf("Заказы") }
              val owner = user.role == "Владелец"
              val admin = user.role == "Админ"
              val tabs = if (owner || admin) {
                  listOf("Заказы", "Клиенты", "Финансы", "Чат", "Таймер")
              } else {
                  listOf("Заказы", "Клиенты", "Чат", "Таймер")
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Column {
                                  Text("Деревяшкино")
                                  Text(
                                      "${user.email} · ${user.role}",
                                      style = MaterialTheme.typography.labelSmall
                                  )
                              }
                          },
                          actions = {
                              TextButton(onClick = onSignOut) { Text("Выйти") }
                          }
                      )
                  }
              ) { padding ->
                  Column(Modifier.fillMaxSize().padding(padding)) {
                      ScrollableTabRow(
                          selectedTabIndex = tabs.indexOf(selected).coerceAtLeast(0)
                      ) {
                          tabs.forEach { tab ->
                              Tab(
                                  selected = selected == tab,
                                  onClick = { selected = tab },
                                  text = { Text(tab) }
                              )
                          }
                      }
                      when (selected) {
                          "Заказы" -> OrdersScreen(canEdit = owner || admin)
                          "Клиенты" -> ClientsScreen(canEdit = owner || admin)
                          "Финансы" -> FinanceScreen()
                          "Чат" -> ChatScreen(user)
                          "Таймер" -> TimerScreen()
                      }
                  }
              }
          }
          EOF
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper
        working-directory: project/derevyashkino-ultra
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build debug APK
        working-directory: project/derevyashkino-ultra
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Derevyashkino-ULTRA-debug
          path: project/derevyashkino-ultra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
