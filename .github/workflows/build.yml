name: Build Derevyashkino ULTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - ultra-ready-import
    paths:
      - 'Derevyashkino-ULTRA-phase3-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project archive
        run: |
          test -f Derevyashkino-ULTRA-phase3-source.zip
          mkdir project
          unzip -q Derevyashkino-ULTRA-phase3-source.zip -d project
          test -f project/derevyashkino-ultra/app/build.gradle
          test -f project/derevyashkino-ultra/app/google-services.json

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper
        working-directory: project/derevyashkino-ultra
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build debug APK
        working-directory: project/derevyashkino-ultra
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Derevyashkino-ULTRA-debug
          path: project/derevyashkino-ultra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
