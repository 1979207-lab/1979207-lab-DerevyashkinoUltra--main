<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b24"><meta name="description" content="Деревяшкино Ultra — управление мастерской">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
  <title>Деревяшкино Ultra</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Д</span><div><b>Деревяшкино</b><small>ULTRA WORKSPACE</small></div></div>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard">⌂ <span>Обзор</span></button>
        <button class="nav-item" data-page="orders">▤ <span>Заказы</span></button>
        <button class="nav-item" data-page="clients">♙ <span>Клиенты</span></button>
        <button class="nav-item" data-page="finance">₽ <span>Финансы</span></button>
        <button class="nav-item" data-page="schedule">▦ <span>Расписание</span></button>
        <button class="nav-item" data-page="team">♧ <span>Команда</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Настройки</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="connection-label">Локальный режим</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">МАСТЕРСКАЯ / УПРАВЛЕНИЕ</span><h1 id="page-title">Обзор</h1></div><div class="top-actions"><span class="today" id="today"></span><button id="user-button" class="user-chip">Владелец ▾</button></div></header>
      <section id="page-content" class="content"></section>
    </main>
  </div>
  <dialog id="order-dialog" class="dialog">
    <form id="order-form" method="dialog">
      <div class="dialog-head"><div><span class="eyebrow">НОВАЯ ЗАПИСЬ</span><h2>Создать заказ</h2></div><button class="icon-button" value="cancel" aria-label="Закрыть">×</button></div>
      <label>Клиент<input name="client" required placeholder="Имя клиента"></label>
      <label>Услуга<input name="service" required placeholder="Например, лазерная гравировка"></label>
      <div class="form-grid"><label>Сумма, ₽<input name="amount" type="number" min="0" step="1" required placeholder="0"></label><label>Статус<select name="status"><option value="new">Новый</option><option value="work">В работе</option><option value="done">Выполнен</option><option value="cancelled">Отменён</option></select></label></div>
      <label>Комментарий<textarea name="note" rows="3" placeholder="Детали заказа (необязательно)"></textarea></label>
      <button class="primary full" value="save">Сохранить заказ</button>
    </form>
  </dialog>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body></html>
